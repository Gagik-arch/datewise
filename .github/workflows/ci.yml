
name: Datewise CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Build Nuvo
      - name: Install root dependencies
        run: npm ci

      - name: Type check Datewise
        run: npm run typecheck

      - name: Build Nuvo
        run: npm run build

      # Create local npm package
      - name: Pack Datewise
        run: |
          mkdir -p artifacts
          npm pack --pack-destination ./artifacts

      # Install example dependencies
      - name: Install example dependencies
        working-directory: example
        run: npm ci

      # Install current Datewise build
      - name: Install local Datewise package
        working-directory: example
        shell: bash
        run: |
          PACKAGE=$(find ../artifacts -name "*.tgz" -print -quit)
          npm install --no-save --package-lock=false "$PACKAGE"

      # Validate example
      - name: Build example
        working-directory: example
        run: npm run build
