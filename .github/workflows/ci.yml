
name: Datewise CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            example/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build Datewise
        run: npm run build

      - name: Pack Datewise
        run: |
          mkdir -p artifacts
          npm pack --pack-destination ./artifacts

      - name: Install example dependencies
        working-directory: example
        run: npm ci

      - name: Install local Datewise package
        working-directory: example
        shell: bash
        run: |
          PACKAGE=$(find ../artifacts -name "*.tgz" -print -quit)

          if [ -z "$PACKAGE" ]; then
            echo "Datewise package not found!"
            exit 1
          fi

          npm install --no-save --package-lock=false "$PACKAGE"

      - name: Build example
        working-directory: example
        run: npm run build

     # Publish
      - name: Publish to npm
        run: npm publish --access public