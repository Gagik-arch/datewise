
name: Publish Datewise

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org

      # Install and validate Datewise
      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build Datewise
        run: npm run build

      # Package Datewise
      - name: Pack Datewise
        run: |
          mkdir -p artifacts
          npm pack --pack-destination ./artifacts

      # Test example against the package being released
      - name: Install example dependencies
        working-directory: example
        run: npm ci

      - name: Install local Datewise package
        working-directory: example
        shell: bash
        run: |
          PACKAGE=$(find ../artifacts -name "*.tgz" -print -quit)
          npm install --no-save --package-lock=false "$PACKAGE"

      - name: Build example
        working-directory: example
        run: npm run build

      # Publish
      - name: Publish to npm
        run: npm publish --access public
