
name: Publish Datewise

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify release version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Version mismatch!"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build Datewise
        run: npm run build

      - name: Pack Datewise
        run: |
          mkdir -p artifacts
          npm pack --pack-destination ./artifacts

      - name: Install example dependencies
        working-directory: example
        run: npm ci

      - name: Install local Datewise package
        working-directory: example
        shell: bash
        run: |
          PACKAGE=$(find ../artifacts -name "*.tgz" -print -quit)
          npm install --no-save --package-lock=false "$PACKAGE"

      - name: Build example
        working-directory: example
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public
